<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerir Clientes — Estúdio de Tatuagem</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- O teu CSS Personalizado -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra de Navegação -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Estúdio de Tatuagem</a>
      <div>
        <a href="dashboard.html" class="btn btn-secondary btn-sm">Voltar ao Painel</a>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <div class="container py-4">
    <h1 class="mb-4">Gestão de Clientes</h1>

    <!-- Formulário para Adicionar Cliente -->
    <form id="formCliente">
      <div class="mb-3">
        <label for="nome" class="form-label text-light mb-1">Nome do Cliente</label>
        <input type="text" id="nome" class="form-control" placeholder="Ex: Ana Silva" required>
      </div>
      <div class="mb-3">
        <label for="cpf" class="form-label text-light mb-1">CPF</label>
        <input type="text" id="cpf" class="form-control" placeholder="Ex: 000.000.000-00" required>
      </div>
      <div class="mb-3">
        <label for="telefone" class="form-label text-light mb-1">Telefone / Telemóvel</label>
        <input type="text" id="telefone" class="form-control" placeholder="Ex: (11) 99999-9999">
      </div>
      <button type="submit" class="btn btn-primary">Cadastrar Cliente</button>
    </form>

    <!-- Lista / Tabela de Clientes -->
    <div class="card-custom mt-4 p-3">
      <h3 class="mb-3 text-light">Clientes Registados</h3>
      <div class="table-responsive">
        <table class="table table-dark table-striped">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th style="width: 100px;">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaClientes">
            <!-- Os dados inseridos via JavaScript vão aparecer aqui dinamicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    protegerPagina() // Garante que só entra se estiver logado
  </script>
  <!-- Ficheiro JavaScript responsável por enviar os dados do cliente -->
  <script src="js/clientes.js"></script>
</body>
</html>
