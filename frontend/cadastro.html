<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Cadastro — Estúdio de Tatuagem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">

    <div class="card bg-secondary p-4 shadow" style="width: 350px;">
        <h3 class="text-center mb-3">Novo Funcionário</h3>
        
        <form id="formCadastro">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" id="nome" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" id="senha" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </form>

        <div class="text-center mt-3">
            <a href="dashboard.html" class="text-light text-decoration-none">Voltar ao Painel</a>
        </div>
    </div>

    <!-- Scripts de Autenticação e Lógica -->
    <script src="js/auth.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
