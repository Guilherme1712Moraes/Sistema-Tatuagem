<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Senioridade — Estúdio de Tatuagem</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- O teu CSS Personalizado -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra de Navegação -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Estúdio de Tatuagem</a>
      <div>
        <a href="dashboard.html" class="btn btn-secondary btn-sm">Voltar ao Painel</a>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <div class="container py-4">
    <h1 class="mb-4">Gestão de Senioridade</h1>

    <!-- Formulário para Adicionar Senioridade -->
    <form id="formSenioridade">
      <div class="mb-3">
        <label for="nivel" class="form-label text-light mb-1">Nível de Senioridade</label>
        <input type="text" id="nivel" class="form-control" placeholder="Ex: Júnior, Pleno, Sênior, Master" required>
      </div>
      <div class="mb-3">
        <label for="descricao" class="form-label text-light mb-1">Descrição / Detalhes</label>
        <input type="text" id="descricao" class="form-control" placeholder="Ex: Tatuador em formação" required>
      </div>
      <button type="submit" class="btn btn-success">Cadastrar Senioridade</button>
    </form>

    <!-- Lista / Tabela de Senioridades -->
    <div class="card-custom mt-4">
      <h3 class="mb-3">Níveis Registados</h3>
      <div class="table-responsive">
        <table class="table table-dark table-striped">
          <thead>
            <tr>
              <th>Nível</th>
              <th>Descrição</th>
              <th style="width: 100px;">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaSenioridade">
            <!-- Os dados inseridos via JavaScript vão aparecer aqui dinamicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script>
    protegerPagina() // Garante que só entra se estiver logado
  </script>
  <script src="js/senioridade.js"></script>
</body>
</html>
