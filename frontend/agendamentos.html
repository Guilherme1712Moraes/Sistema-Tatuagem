<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Agendamentos — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>
      <div>
        <a href="dashboard.html" class="text-light me-3">Início</a>
        <a href="clientes.html" class="text-light me-3">Clientes</a>
        <a href="senioridade.html" class="text-light me-3">Senioridade</a>
        <a href="estilos.html" class="text-light me-3">Estilos</a>
        <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
        <a href="agendamentos.html" class="text-light fw-bold me-3">Agendamentos</a>
        <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-4">Gestão de Agendamentos</h2>

    <!-- Formulário -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title" id="titulo-form">Novo Agendamento</h5>
        <form id="form-agendamento">
          <input type="hidden" id="agendamento-id">
          
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Cliente</label>
              <select id="cliente_id" class="form-select" required>
                <option value="">Selecione um cliente...</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Tatuador</label>
              <select id="tatuador_id" class="form-select" required>
                <option value="">Selecione um tatuador...</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Data</label>
              <input type="date" id="data" class="form-control" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Hora</label>
              <input type="time" id="hora" class="form-control" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Valor (R$)</label>
              <input type="number" step="0.01" id="valor" class="form-control" required>
            </div>

            <div class="col-md-8">
              <label class="form-label">Descrição / Ideia</label>
              <input type="text" id="descricao" class="form-control" placeholder="Ex: Tatuagem no braço">
            </div>

            <div class="col-md-4" id="grupo-status" style="display: none;">
              <label class="form-label">Status</label>
              <select id="status" class="form-select">
                <option value="pendente">Pendente</option>
                <option value="confirmado">Confirmado</option>
                <option value="concluido">Concluído</option>
                <option value="cancelado">Cancelado</option>
              </select>
            </div>

            <!-- Novo campo para Upload do Desenho Aprovado -->
            <div class="col-md-12">
              <label class="form-label">Desenho Aprovado (Imagem)</label>
              <input type="file" id="desenho" class="form-control" accept="image/*">
            </div>
          </div>

          <button type="submit" class="btn btn-primary mt-3" id="btn-salvar">Cadastrar Agendamento</button>
          <button type="button" class="btn btn-secondary mt-3 ms-2" id="btn-cancelar" style="display:none;" onclick="limparFormulario()">Cancelar</button>
        </form>
      </div>
    </div>

    <!-- Tabela -->
    <table class="table table-striped table-hover bg-white rounded shadow-sm">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Tatuador</th>
          <th>Data</th>
          <th>Hora</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Desenho</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
        <!-- Injetado via JS -->
      </tbody>
    </table>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/agendamentos.js"></script>
</body>
</html>
