<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tatuadores — Estúdio de Tatuagem</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="container py-4">


    <!-- ================================================== -->
    <!-- MENU -->
    <!-- ================================================== -->

    <nav class="navbar navbar-dark bg-dark mb-4">

        <div class="container">

            <span class="navbar-brand">
                Estúdio de Tatuagem
            </span>

            <div>

                <a
                    href="clientes.html"
                    class="text-light me-3"
                >
                    Clientes
                </a>

                <a
                    href="senioridade.html"
                    class="text-light me-3"
                >
                    Senioridade
                </a>

                <a
                    href="estilos.html"
                    class="text-light me-3"
                >
                    Estilos
                </a>

                <a
                    href="tatuadores.html"
                    class="text-light me-3"
                >
                    Tatuadores
                </a>

                <a
                    href="agendamentos.html"
                    class="text-light"
                >
                    Agendamentos
                </a>

            </div>

        </div>

    </nav>


    <h1 class="mb-3">
        Tatuadores
    </h1>


    <!-- ================================================== -->
    <!-- FORMULÁRIO -->
    <!-- ================================================== -->

    <form
        id="form-tatuador"
        class="card p-3 mb-4"
    >


        <!-- NOME -->

        <div class="mb-3">

            <label
                for="nome"
                class="form-label"
            >
                Nome do Tatuador
            </label>

            <input
                type="text"
                id="nome"
                class="form-control"
                required
            >

        </div>


        <!-- CPF -->

        <div class="mb-3">

            <label
                for="cpf"
                class="form-label"
            >
                CPF
            </label>

            <input
                type="text"
                id="cpf"
                class="form-control"
                maxlength="14"
                placeholder="000.000.000-00"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="mb-3">

            <label
                for="email"
                class="form-label"
            >
                E-mail
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
            >

        </div>


        <!-- TELEFONE -->

        <div class="mb-3">

            <label
                for="telefone"
                class="form-label"
            >
                Telefone
            </label>

            <input
                type="text"
                id="telefone"
                class="form-control"
                placeholder="(11) 99999-9999"
            >

        </div>


        <!-- DATA DE CONTRATAÇÃO -->

        <div class="mb-3">

            <label
                for="datacontratacao"
                class="form-label"
            >
                Data de Contratação
            </label>

            <input
                type="date"
                id="datacontratacao"
                class="form-control"
            >

        </div>


        <!-- SENIORIDADE -->

        <div class="mb-3">

            <label
                for="idsenioridade"
                class="form-label"
            >
                Senioridade
            </label>

            <select
                id="idsenioridade"
                class="form-select"
                required
            >

                <option value="">
                    Selecione a senioridade...
                </option>

            </select>

        </div>


        <!-- ESTILOS -->

        <div class="mb-3">

            <label class="form-label">
                Estilos de Especialidade
            </label>

            <div
                id="lista-estilos-checkbox"
                class="border p-3 rounded"
            >

                Carregando estilos...

            </div>

        </div>


        <button
            id="btn-submit-tatuador"
            type="submit"
            class="btn btn-primary"
        >
            Cadastrar
        </button>

    </form>


    <!-- ================================================== -->
    <!-- TABELA -->
    <!-- ================================================== -->

    <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Nome</th>

                    <th>CPF</th>

                    <th>Senioridade</th>

                    <th>Estilos</th>

                    <th>Ações</th>

                </tr>

            </thead>

            <tbody id="corpo-tabela">
            </tbody>

        </table>

    </div>


    <!-- IMPORTANTE: auth.js vem primeiro -->

    <script src="js/auth.js"></script>

    <script src="js/tatuadores.js"></script>


</body>

</html>
